name: Tests

on:
  push:
    branches: [dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Gradle client itself loads a native library; without this, every run starts with a warning.
  GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
  GDK_BACKEND: x11
  WEBKIT_DISABLE_DMABUF_RENDERER: "1"
  WEBKIT_DISABLE_COMPOSITING_MODE: "1"

jobs:
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: Linux
          - runner: windows-2025
            name: Windows
          - runner: macos-15
            name: macOS
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      - name: Install GTK, WebKitGTK, and Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libwebkit2gtk-4.1-0 libxtst6 xvfb

      - name: Style and headless tests
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest test

      - name: Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-reports-${{ runner.os }}
          path: '**/build/reports/checkstyle/'
          if-no-files-found: ignore

      - name: Display tests under Xvfb
        id: display-xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew displayTest -Dlwjwae.requireDisplay=true -Dlwjwae.screenshots=true

      - name: Display tests
        id: display
        if: runner.os != 'Linux'
        run: ./gradlew displayTest "-Dlwjwae.requireDisplay=true" "-Dlwjwae.screenshots=true"

      - name: Screenshots
        # Only after the display tests ran: a failure before them has no pictures to upload.
        if: always() && (steps.display.outcome != 'skipped' || steps.display-xvfb.outcome != 'skipped')
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.name }}
          path: '**/build/screenshots/'
          if-no-files-found: error

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.name }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
